<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOL 2026 — Forest Leaderboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #111111;
  --bg2:       #1A1A1A;
  --card:      #1F1F1F;
  --card2:     #252525;
  --border:    #2A2A2A;
  --border2:   #383838;
  --yellow:    #F5C800;
  --yellow-dk: #E8B800;
  --red:       #CC2200;
  --green:     #27AE60;
  --text:      #DDDDDD;
  --text-h:    #FFFFFF;
  --muted:     #666666;
}

body {
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}

header {
  background: linear-gradient(135deg, #1A1A1A 0%, #2A1A1A 100%);
  color: var(--yellow);
  padding: 30px 20px;
  border-bottom: 3px solid var(--yellow);
  margin-bottom: 30px;
  border-radius: 12px;
  text-align: center;
}

.header-title {
  font-size: 2.2em;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--yellow);
  margin-bottom: 12px;
}

.header-sub {
  font-size: 0.9em;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.header-tagline {
  font-size: 0.85em;
  color: var(--yellow);
  font-style: italic;
  letter-spacing: 0.5px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 30px;
  max-width: 600px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
}

.stat-value {
  font-size: 2.2em;
  font-weight: 800;
  color: var(--yellow);
  margin-bottom: 6px;
}

.stat-label {
  font-size: 0.8em;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.section-title {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--yellow);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
}

.leaderboard {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}

.team-card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
  border: 2px solid var(--border2);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.team-card:hover {
  transform: translateY(-5px);
  border-color: var(--yellow);
  box-shadow: 0 8px 20px rgba(245, 200, 0, 0.2);
}

.team-card.gold-border {
  border-color: #FFD700 !important;
  box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
  background: linear-gradient(135deg, #1F1F1F 0%, #2A2A1A 100%);
}

.team-card.silver-border {
  border-color: #A0A0A0 !important;
  box-shadow: 0 0 20px rgba(160, 160, 160, 0.3);
  background: linear-gradient(135deg, #1F1F1F 0%, #1A2A2A 100%);
}

.team-card.bronze-border {
  border-color: #CD7F32 !important;
  box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
  background: linear-gradient(135deg, #1F1F1F 0%, #2A1A1A 100%);
}

.team-rank {
  font-size: 0.7em;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
}

.team-name {
  font-weight: 700;
  font-size: 0.95em;
  color: var(--text-h);
  margin-bottom: 10px;
  line-height: 1.2;
}

.tree-wrap {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 10px 0;
}

.tree-wrap svg {
  max-height: 100%;
  max-width: 100%;
}

.team-score {
  font-size: 2em;
  font-weight: 800;
  color: var(--yellow);
  line-height: 1;
  margin-bottom: 6px;
}

.team-pts-label {
  font-size: 0.68em;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
  font-weight: 600;
}

.team-sub {
  font-size: 0.65em;
  color: var(--muted);
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--yellow), var(--green));
  transition: width 0.5s ease;
}

.top-3-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.podium-card {
  text-align: center;
  padding: 20px;
  border-radius: 12px;
  background: var(--card);
  border: 2px solid var(--border);
}

.podium-rank {
  font-size: 3em;
  margin-bottom: 10px;
}

.refresh-note {
  text-align: center;
  padding: 20px;
  background: var(--card2);
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 0.85em;
  color: var(--muted);
  margin-top: 30px;
}

.refresh-interval {
  font-weight: 600;
  color: var(--yellow);
}

@media (max-width: 768px) {
  .leaderboard {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .header-title {
    font-size: 1.6em;
  }

  .team-score {
    font-size: 1.6em;
  }
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.loading-spinner {
  font-size: 3em;
  animation: spin 2s linear infinite;
  display: inline-block;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.admin-button {
  position: fixed;
  top: 20px;
  right: 20px;
  background: linear-gradient(135deg, var(--yellow), var(--yellow-dk));
  color: #000;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.9em;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
  box-shadow: 0 4px 12px rgba(245, 200, 0, 0.3);
}

.admin-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(245, 200, 0, 0.5);
}

@media (max-width: 768px) {
  .admin-button {
    position: static;
    margin-bottom: 20px;
    width: 100%;
    justify-content: center;
  }
}
</style>
</head>
<body>

<header>
  <a href="FOL%20POST-TRAINING%20SCOREBOARD.html" class="admin-button">🔧 Admin Dashboard</a>
  <div class="header-title">🌳 FOL 2026 Forest Challenge</div>
  <div class="header-sub">Live Team Rankings</div>
  <div class="header-tagline">Growing together · Building tomorrow</div>
</header>

<div class="container">

  <!-- Stats Overview -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="stat-teams">10</div>
      <div class="stat-label">Teams Growing</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-leading">—</div>
      <div class="stat-label">Leading Team</div>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="section-title">🏆 Leaderboard Rankings</div>
  <div class="leaderboard" id="leaderboard">
    <div class="loading">
      <div class="loading-spinner">🌱</div>
      <p>Loading team data...</p>
    </div>
  </div>

  <!-- Refresh Note -->
  <div class="refresh-note">
    ℹ️ Scores update automatically every <span class="refresh-interval">60 seconds</span>
  </div>

</div>

<script>
// ==================== DATA ====================
const TEAM_NAMES = [
  '🏢 CSC', '🌿 BM', '🌿 RU', '🌿 GL', '🌿 GY',
  '🌿 SS2', '🌿 PC', '🌿 CL', '🌿 MA', '🌿 SU'
];

const TEAM_COLORS = [
  '#C0392B','#1E7A4A','#7D3C98','#2471A3','#D35400',
  '#1ABC9C','#F39C12','#2980B9','#E74C3C','#27AE60'
];

let state = {
  trainingScores: Array(10).fill(0),
  postTrainingScores: Array(10).fill(0),
  loaded: false
};

// ==================== DATA LOADING ====================
function loadFromLocalStorage() {
  try {
    const fol = JSON.parse(localStorage.getItem('fol2026-posttraining'));
    if (fol) {
      state.trainingScores = fol.trainingScores || Array(10).fill(0);
      state.postTrainingScores = fol.postTrainingScores || Array(10).fill(0);
    }
    state.loaded = true;
    renderUI();
  } catch (e) {
    console.log('No data found, showing default state');
    state.loaded = true;
    renderUI();
  }
}

// ==================== TREE GROWTH ====================
function getTreeTier(score) {
  if (score <= 10) return { tier: 0, name: '🌱 Seed', emoji: '🌱' };
  if (score <= 25) return { tier: 1, name: '🌿 Sapling', emoji: '🌿' };
  if (score <= 40) return { tier: 2, name: '🌳 Young Tree', emoji: '🌳' };
  if (score <= 60) return { tier: 3, name: '🌲 Giant Tree', emoji: '🌲' };
  if (score <= 80) return { tier: 4, name: '🍎 Fruitful Tree', emoji: '🍎' };
  if (score <= 100) return { tier: 5, name: '🌟 Tree of Life', emoji: '🌟' };
  return { tier: 5, name: '🌟 Tree of Life', emoji: '🌟' };
}

function getTreeSVG(score, color) {
  const scoreInForest = ((score - 1) % 100) + 1;
  const stage = scoreInForest <= 10 ? 0 : scoreInForest <= 25 ? 1 : scoreInForest <= 40 ? 2 : scoreInForest <= 60 ? 3 : scoreInForest <= 80 ? 4 : 5;
  const cl = lighten(color, 55);

  const trees = [
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="83" rx="22" ry="6" fill="#A0782A" opacity="0.4"/><line x1="40" y1="78" x2="40" y2="83" stroke="#6B4F1A" stroke-width="3" stroke-linecap="round"/><ellipse cx="40" cy="74" rx="8" ry="6" fill="${color}" opacity="0.85"/><ellipse cx="40" cy="71" rx="4" ry="3" fill="${cl}" opacity="0.7"/></svg>`,
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="84" rx="24" ry="6" fill="#A0782A" opacity="0.4"/><rect x="37.5" y="56" width="5" height="28" rx="2.5" fill="#7B5B1E"/><ellipse cx="40" cy="50" rx="14" ry="11" fill="${color}"/><ellipse cx="27" cy="57" rx="10" ry="8" fill="${color}" opacity="0.8"/><ellipse cx="53" cy="57" rx="10" ry="8" fill="${color}" opacity="0.8"/><ellipse cx="40" cy="43" rx="9" ry="7" fill="${cl}"/></svg>`,
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="85" rx="26" ry="6" fill="#A0782A" opacity="0.4"/><rect x="36.5" y="50" width="7" height="36" rx="3" fill="#6B4F1A"/><ellipse cx="40" cy="42" rx="20" ry="16" fill="${color}"/><ellipse cx="22" cy="52" rx="14" ry="11" fill="${color}" opacity="0.85"/><ellipse cx="58" cy="52" rx="14" ry="11" fill="${color}" opacity="0.85"/><ellipse cx="40" cy="29" rx="13" ry="11" fill="${cl}" opacity="0.9"/><ellipse cx="28" cy="37" rx="10" ry="8" fill="${cl}" opacity="0.75"/><ellipse cx="52" cy="37" rx="10" ry="8" fill="${cl}" opacity="0.75"/></svg>`,
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="86" rx="28" ry="6" fill="#A0782A" opacity="0.4"/><rect x="36" y="46" width="8" height="42" rx="3.5" fill="#5D4015"/><ellipse cx="40" cy="37" rx="24" ry="19" fill="${color}"/><ellipse cx="19" cy="49" rx="16" ry="13" fill="${color}" opacity="0.85"/><ellipse cx="61" cy="49" rx="16" ry="13" fill="${color}" opacity="0.85"/><ellipse cx="40" cy="23" rx="17" ry="13" fill="${cl}"/><ellipse cx="26" cy="32" rx="13" ry="10" fill="${cl}" opacity="0.75"/><ellipse cx="54" cy="32" rx="13" ry="10" fill="${cl}" opacity="0.75"/></svg>`,
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="86" rx="28" ry="6" fill="#A0782A" opacity="0.4"/><rect x="36" y="45" width="8" height="43" rx="3.5" fill="#5D4015"/><ellipse cx="40" cy="35" rx="26" ry="21" fill="${color}"/><ellipse cx="17" cy="49" rx="17" ry="14" fill="${color}" opacity="0.85"/><ellipse cx="63" cy="49" rx="17" ry="14" fill="${color}" opacity="0.85"/><ellipse cx="40" cy="20" rx="19" ry="15" fill="${cl}"/><ellipse cx="25" cy="30" rx="14" ry="11" fill="${cl}" opacity="0.75"/><ellipse cx="55" cy="30" rx="14" ry="11" fill="${cl}" opacity="0.75"/><circle cx="30" cy="42" r="4" fill="#E74C3C"/><circle cx="50" cy="40" r="4" fill="#E74C3C"/><circle cx="20" cy="52" r="3.5" fill="#E74C3C"/><circle cx="60" cy="48" r="3.5" fill="#E74C3C"/><circle cx="40" cy="48" r="4" fill="#F39C12"/><circle cx="33" cy="30" r="3" fill="#E74C3C" opacity="0.8"/><text x="33" y="12" font-size="10" fill="#FFD700" text-anchor="middle">★</text><text x="47" y="9" font-size="7" fill="#FFD700">★</text></svg>`,
    `<svg viewBox="0 0 80 90" width="70" height="70"><ellipse cx="40" cy="83" rx="24" ry="7" fill="#A0782A" opacity="0.5"/><rect x="37" y="55" width="6" height="28" rx="3" fill="#6B4F1A"/><ellipse cx="40" cy="52" rx="22" ry="18" fill="${color}"/><ellipse cx="40" cy="25" rx="20" ry="16" fill="${cl}"/><ellipse cx="22" cy="36" rx="15" ry="12" fill="${cl}" opacity="0.8"/><ellipse cx="58" cy="36" rx="15" ry="12" fill="${cl}" opacity="0.8"/><circle cx="28" cy="48" r="4" fill="#FFD700"/><circle cx="52" cy="46" r="4" fill="#FFD700"/><circle cx="18" cy="54" r="3.5" fill="#FFD700"/><circle cx="62" cy="50" r="3.5" fill="#FFD700"/><circle cx="40" cy="52" r="4.5" fill="#FFD700"/><circle cx="32" cy="30" r="3" fill="#FFD700" opacity="0.9"/><circle cx="50" cy="28" r="3" fill="#FFD700" opacity="0.9"/><text x="40" y="10" font-size="13" fill="#FFD700" text-anchor="middle" opacity="0.95">★</text><text x="26" y="18" font-size="9" fill="#FFD700" text-anchor="middle">★</text><text x="54" y="16" font-size="9" fill="#FFD700" text-anchor="middle">★</text></svg>`,
  ];
  return trees[stage];
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

// ==================== UI RENDERING ====================
function renderUI() {
  renderLeaderboard();
  renderStats();
}

function renderStats() {
  const scores = state.trainingScores.map((t, i) => t + state.postTrainingScores[i]);
  const maxScore = Math.max(...scores);
  const leadingIdx = scores.indexOf(maxScore);
  const leadingTeam = TEAM_NAMES[leadingIdx].replace(/^[\s\S]+\s/, '');

  document.getElementById('stat-leading').textContent = leadingTeam;
}

function renderLeaderboard() {
  const container = document.getElementById('leaderboard');

  if (!state.loaded) {
    container.innerHTML = '<div class="loading"><div class="loading-spinner">🌱</div><p>Loading leaderboard...</p></div>';
    return;
  }

  const ranked = state.trainingScores.map((training, i) => ({
    idx: i,
    name: TEAM_NAMES[i],
    color: TEAM_COLORS[i],
    total: training + state.postTrainingScores[i]
  })).sort((a, b) => b.total - a.total);

  container.innerHTML = ranked.map((team, rank) => {
    const rankEmoji = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `#${rank + 1}`;
    const borderClass = rank === 0 ? 'gold-border' : rank === 1 ? 'silver-border' : rank === 2 ? 'bronze-border' : '';
    const scoreInForest = ((team.total - 1) % 100) + 1;
    const tier = getTreeTier(scoreInForest);
    const completedForests = Math.floor(team.total / 100);
    const treeSvg = getTreeSVG(team.total, team.color);

    // Build multiple tree display
    let treesHtml = '';
    for (let i = 0; i < completedForests; i++) {
      treesHtml += getTreeSVG(100, team.color);
    }
    if (team.total % 100 > 0 || team.total === 0) {
      treesHtml += treeSvg;
    }

    let tierLabel = tier.name;
    if (completedForests > 0) {
      tierLabel = `🌟×${completedForests} + ${tier.emoji} ${tier.name}`;
    }

    return `
      <div class="team-card ${borderClass}">
        <div class="team-rank">${rankEmoji}</div>
        <div class="team-name">${team.name}</div>
        <div class="tree-wrap" style="display:flex;justify-content:center;gap:4px;flex-wrap:wrap">
          ${treesHtml}
        </div>
        <div class="team-score">${team.total}</div>
        <div class="team-pts-label" style="color:var(--yellow);font-weight:600">${tierLabel}</div>
      </div>
    `;
  }).join('');
}

// ==================== AUTO REFRESH ====================
function startAutoRefresh() {
  // Load immediately
  loadFromLocalStorage();

  // Then refresh every 60 seconds
  setInterval(() => {
    loadFromLocalStorage();
  }, 60 * 1000);
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  startAutoRefresh();
});
</script>

</body>
</html>
